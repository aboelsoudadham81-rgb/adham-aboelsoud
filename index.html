<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <p class="made-by">Made by / Adham Aboelsoud</p>
  <div class="container">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">&#9670;</div>
        <span>MyApp</span>
      </div>
      <h2>Welcome Maloka</h2>
      <p class="subtitle">Sign in to continue</p>

      <form id="loginForm">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" required />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••" required />
            <button type="button" id="togglePassword" class="eye-btn">&#128065;</button>
          </div>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" id="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Login</button>

        <p class="register-link">Don't have an account? <a href="#">Sign up</a></p>
      </form>

      <div id="message" class="message hidden"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
