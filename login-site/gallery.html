<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Love Gallery</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>

  <div class="header">
    <h1>Love Gallery</h1>
    <p>Welcome, Maloka</p>
    <a href="counter.html" class="btn-counter">Our Time</a>
    <button onclick="logout()" class="btn-logout">Logout</button>
  </div>

  <div class="gallery">
    <div class="photo-card" onclick="openLightbox('images/photo1.jpg')">
      <img src="images/photo1.jpg" alt="photo 1" />
      <p>Forever & Always</p>
    </div>
    <div class="photo-card" onclick="openLightbox('images/photo2.jpg')">
      <img src="images/photo2.jpg" alt="photo 2" />
      <p>You & Me</p>
    </div>
    <div class="photo-card" onclick="openLightbox('images/photo3.jpg')">
      <img src="images/photo3.jpg" alt="photo 3" />
      <p>Together Forever</p>
    </div>
    <div class="photo-card" onclick="openLightbox('images/photo4.jpg')">
      <img src="images/photo4.jpg" alt="photo 4" />
      <p>Pure Love</p>
    </div>
    <div class="photo-card" onclick="openLightbox('images/photo5.jpg')">
      <img src="images/photo5.jpg" alt="photo 5" />
      <p>Endless Love</p>
    </div>
    <div class="photo-card" onclick="openLightbox('images/photo6.jpg')">
      <img src="images/photo6.jpg" alt="photo 6" />
      <p>My Heart</p>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" onclick="closeLightbox()">
    <span class="close-btn">&times;</span>
    <img id="lightbox-img" src="" alt="full view" />
  </div>

  <script>
    function logout() {
      window.location.href = "index.html";
    }

    function openLightbox(src) {
      document.getElementById("lightbox-img").src = src;
      document.getElementById("lightbox").classList.add("active");
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }

    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeLightbox();
    });
  </script>
</body>
</html>
